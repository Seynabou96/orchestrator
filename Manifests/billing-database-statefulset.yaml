apiVersion: v1
kind: Service
metadata:
  name: billing-app
  namespace: default
spec:
  selector:
    app: billing-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-app
  namespace: default
spec:
  serviceName: billing-app
  replicas: 1
  selector:
    matchLabels:
      app: billing-app
  template:
    metadata:
      labels:
        app: billing-app
    spec:
      containers:
        - name: billing-app
          image: talibedev/play-with-container-billing-app:v1
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BILLING_DB_URL
              valueFrom:
                secretKeyRef:
                  name: billing-app-secret
                  key: BILLING_DB_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: billing-app-secret
                  key: RABBITMQ_URL
            - name: RABBITMQ_QUEUE
              value: "billing_queue"  # Ajout de la variable manquante
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3