# Service pour le billing-app
apiVersion: v1
kind: Service
metadata:
  name: billing-app-service
  namespace: default
  labels:
    app: billing-app
    component: service
spec:
  selector:
    app: billing-app
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP

---
# StatefulSet pour le billing-app (exigence du sujet)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-app
  namespace: default
  labels:
    app: billing-app
    component: statefulset
spec:
  serviceName: "billing-app-service"
  replicas: 1
  selector:
    matchLabels:
      app: billing-app
  template:
    metadata:
      labels:
        app: billing-app
    spec:
      # GESTION DES DÉPENDANCES - Tests plus robustes
      initContainers:
      - name: wait-for-database
        image: sniang96/billing-app:orchestrator  # Utilise votre image Debian
        command: ['sh', '-c']
        args:
        - |
          echo "Attente de PostgreSQL..."
          until pg_isready -h billing-database-service -p 5432 -U "$BILLING_USER" -d "$BILLING_DB"; do
            echo "PostgreSQL non disponible, attente..."
            sleep 3
          done
          echo "PostgreSQL prêt!"
        
        envFrom:
        - secretRef:
            name: billing-db-credentials
        - configMapRef:
            name: billing-db-config
      - name: wait-for-rabbitmq
        image: busybox
        command: ['sh', '-c']
        args:
        - |
          echo "Test RabbitMQ service..."
          until nc -z rabbitmq-service 5672; do
            echo "RabbitMQ service pas prêt..."
            sleep 5
          done
          echo "RabbitMQ service prêt!"
      
      containers:
      - name: billing-app
        image: sniang96/billing-app:orchestrator
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 150m
            memory: 200Mi
          limits:
            cpu: 300m
            memory: 400Mi
        
        # Configuration - construire les URLs côté application
        envFrom:
        - secretRef:
            name: rabbitmq-credentials
        - secretRef:
            name: billing-db-credentials  
        - configMapRef:
            name: rabbitmq-config
        - configMapRef:
            name: billing-db-config
        env:
        # URL de connexion à la base de données (votre méthode qui fonctionne)
        - name: BILLING_DB_URL
          value: "postgresql://$(BILLING_USER):$(BILLING_PASSWORD)@billing-database-service:5432/$(BILLING_DB)"
        # URL RabbitMQ (votre méthode qui fonctionne)
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq-service:5672/"
        # Variables additionnelles
        - name: BILLING_APP_PORT
          value: "8080"
        - name: NODE_ENV
          value: "production"
        
        # HEALTHCHECKS - Plus tolérants car dépendances vérifiées
        startupProbe:
          exec:
            command: ["python3", "healthcheck.py"]
          initialDelaySeconds: 15      # InitContainers ont validé les dépendances
          failureThreshold: 20         # Plus d'essais au cas où
          periodSeconds: 5
        
        livenessProbe:
          exec:
            command: ["python3", "healthcheck.py"]
          initialDelaySeconds: 60      # Application initialisée
          periodSeconds: 30
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command: ["python3", "healthcheck.py"]
          initialDelaySeconds: 10      # Test rapide après startup
          periodSeconds: 10
          failureThreshold: 5
        
        # Volumes pour état persistant
        volumeMounts:
        - name: logs-volume
          mountPath: /var/log/billing-app
        - name: billing-app-data
          mountPath: /var/lib/billing-app
      
      volumes:
      - name: logs-volume
        emptyDir: {}
  
  # PersistentVolumeClaim template pour StatefulSet
  volumeClaimTemplates:
  - metadata:
      name: billing-app-data
      labels:
        app: billing-app
        component: storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 200Mi
      storageClassName: "local-path"
