apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: default
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: LoadBalancer # Expose l'API Gateway à l'extérieur
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # === INIT CONTAINERS ===
      initContainers:
      # Attendre que RabbitMQ soit prêt
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for RabbitMQ to be ready on port 5672..."
          until nc -z rabbitmq 5672; do
            echo "RabbitMQ not ready yet, retrying in 3 seconds..."
            sleep 3
          done
          echo "✓ RabbitMQ is ready!"
      
      # Attendre que inventory-app soit prêt
      - name: wait-for-inventory
        image: busybox:1.36
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for inventory-app to be ready on port 8080..."
          until nc -z inventory-app 8080; do
            echo "Inventory-app not ready yet, retrying in 3 seconds..."
            sleep 3
          done
          echo "✓ Inventory-app is ready!"
      
      # Attendre que billing-app soit prêt (optionnel si billing-db existe)
      - name: wait-for-billing
        image: busybox:1.36
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for billing-app to be ready on port 8080..."
          timeout=120
          elapsed=0
          until nc -z billing-app 8080 || [ $elapsed -ge $timeout ]; do
            echo "Billing-app not ready yet, retrying in 3 seconds... ($elapsed/$timeout)"
            sleep 3
            elapsed=$((elapsed + 3))
          done
          if nc -z billing-app 8080; then
            echo "✓ Billing-app is ready!"
          else
            echo "⚠ Billing-app timeout after ${timeout}s, continuing anyway..."
          fi
      
      # === MAIN CONTAINER ===
      containers:
      - name: api-gateway
        image: talibedev/play-with-container-api-gateway:v1
        ports:
        - containerPort: 3000
          name: http
        env:
        # === URLs des microservices ===
        - name: BILLING_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: BILLING_SERVICE_URL
        - name: INVENTORY_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: INVENTORY_SERVICE_URL
        - name: BILLING_API_URL
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: BILLING_API_URL
        - name: INVENTORY_API_URL
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: INVENTORY_API_URL
        # === RabbitMQ configuration ===
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: RABBITMQ_URL
        - name: RABBITMQ_HOST
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: RABBITMQ_PORT
        - name: RABBITMQ_USER
          value: "sdiene"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_QUEUE
          valueFrom:
            secretKeyRef:
              name: api-gateway-secret
              key: RABBITMQ_QUEUE
        # === Port exposé ===
        - name: EXPOSED_PORT
          value: "3000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # === SONDES TCP au lieu de HTTP (car /health retourne 404) ===
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60