# RabbitMQ Secrets
# Credentials pour le service de messagerie RabbitMQ

apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: default
  labels:
    app: rabbitmq
    component: credentials
type: Opaque
data:
  # RabbitMQ credentials (base64 encoded)
  RABBITMQ_USER: YWRtaW4=          # admin
  RABBITMQ_PASSWORD: cGFzc3dvcmQ=  # password

---
# ConfigMap pour la configuration RabbitMQ (non-sensible)
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: default
  labels:
    app: rabbitmq
    component: configuration
data:
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_QUEUE: "billing_queue"