# Billing Database Secrets
# Credentials pour la base de données Billing (PostgreSQL)

apiVersion: v1
kind: Secret
metadata:
  name: billing-db-credentials
  namespace: default
  labels:
    app: billing-database
    component: credentials
type: Opaque
data:
  # Billing Database credentials (base64 encoded)
  POSTGRES_USER: YmlsbGluZ191c2Vy    # billing_user
  POSTGRES_PASSWORD: cGFzc3dvcmQ=    # password
  BILLING_USER: YmlsbGluZ191c2Vy     # billing_user (alias for compatibility)
  BILLING_PASSWORD: cGFzc3dvcmQ=     # password (alias for compatibility)

---
# ConfigMap pour la configuration Billing Database (non-sensible)
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-db-config
  namespace: default
  labels:
    app: billing-database
    component: configuration
data:
  POSTGRES_DB: "billing_db"
  BILLING_DB: "billing_db"          # alias for compatibility
  POSTGRES_PORT: "5432"
  BILLING_DB_HOST: "billing-database"
  # BILLING_DB_URL: "postgresql://$(BILLING_USER):$(BILLING_PASSWORD)@billing-database:5432/$(BILLING_DB)"