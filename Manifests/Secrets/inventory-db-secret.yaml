# Inventory Database Secrets
# Credentials pour la base de données Inventory (PostgreSQL)

apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-credentials
  namespace: default
  labels:
    app: inventory-database
    component: credentials
type: Opaque
data:
  # Inventory Database credentials (base64 encoded)
  POSTGRES_USER: aW52X3VzZXI=      # inv_user
  POSTGRES_PASSWORD: cGFzc3dvcmQ=  # password
  INV_USER: aW52X3VzZXI=           # inv_user (alias for compatibility)
  INV_PASSWORD: cGFzc3dvcmQ=       # password (alias for compatibility)

---
# ConfigMap pour la configuration Inventory Database (non-sensible)
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-db-config
  namespace: default
  labels:
    app: inventory-database
    component: configuration
data:
  POSTGRES_DB: "movies_db"
  INVENTORY_DB: "movies_db"
  MOVIES_DB: "movies_db"           # alias for compatibility
  POSTGRES_PORT: "5432"
  INVENTORY_DB_HOST: "inventory-database-service"
  INVENTORY_DB_URL: "postgresql://$(INV_USER):$(INV_PASSWORD)@inventory-database-service:5432/$(MOVIES_DB)"