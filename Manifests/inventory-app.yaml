# Deployment pour l'inventory-app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app-deployment
  namespace: default
  labels:
    app: inventory-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      # GESTION DES DÉPENDANCES - Attente de la DB
      initContainers:
      - name: wait-for-database
        image: talibedev/play-with-container-inventory-app:v1
        command: ['sh', '-c']
        args:
        - |
          echo "Test PostgreSQL avec variables..."
          until pg_isready -h inventory-database-service -p 5432 -U "$INV_USER" -d "$MOVIES_DB"; do
            echo "PostgreSQL pas prêt..."
            sleep 3
          done
          echo "PostgreSQL prêt!"
        envFrom:
        - secretRef:
            name: inventory-db-credentials
        - configMapRef:
            name: inventory-db-config
      containers:
      - name: inventory-app
        image: talibedev/play-with-container-inventory-app:v1
        ports:
        - containerPort: 8080
        
        # Configuration via envFrom ET env
        envFrom:
        - secretRef:
            name: inventory-db-credentials  
        - configMapRef:
            name: inventory-db-config
        env:
        - name: INVENTORY_DB_URL
          value: "postgresql://$(INV_USER):$(INV_PASSWORD)@inventory-database-service:5432/$(MOVIES_DB)"
        
        resources:
          requests:
            cpu: 150m
            memory: 200Mi
          limits:
            cpu: 300m
            memory: 400Mi
        
        # HEALTHCHECKS - Plus tolérants car dépendances vérifiées
        startupProbe:
          exec:
            command: ["python3", "healthcheck.py"]
          initialDelaySeconds: 15      # InitContainer a validé la DB
          failureThreshold: 20
          periodSeconds: 5
        
        livenessProbe:
          exec:
            command: ["python3", "healthcheck.py"]
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command: ["python3", "healthcheck.py"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 5

---
# Service pour inventory-app
apiVersion: v1
kind: Service
metadata:
  name: inventory-app-service
  namespace: default
  labels:
    app: inventory-app
    component: service
spec:
  selector:
    app: inventory-app
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP

---
# HorizontalPodAutoscaler pour l'inventory-app
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-app-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-app-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15