apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: default
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672
  # clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: default
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      initContainers:
        - name: fix-permissions
          image: talibedev/play-with-container-rabbitmq:v1
          command:
            - bash
            - -c
            - |
              echo "Fixing permissions for RabbitMQ (UID GID)..."
              RABBITMQ_UID=$(id -u rabbitmq)
              RABBITMQ_GID=$(id -g rabbitmq)
              echo "RABBITMQ UID: $RABBITMQ_UID, RABBITMQ GID: $RABBITMQ_GID..."
              echo "............................................"
              echo "............................................"
              chown -R $RABBITMQ_UID:$RABBITMQ_GID /var/lib/rabbitmq
              chmod -R 755 /var/lib/rabbitmq
              echo "Permissions fixed successfully:"
              ls -la /var/lib/rabbitmq/
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          securityContext:
            runAsUser: 0
      securityContext:
        fsGroup: 101
      nodeSelector:
        kubernetes.io/hostname: agents
      containers:
        - name: rabbitmq
          image: talibedev/play-with-container-rabbitmq:v1
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
            # RABBITMQ_ERLANG_COOKIE supprimé - RabbitMQ générera automatiquement
            - name: RABBITMQ_VM_MEMORY_HIGH_WATERMARK
              value: "0.4"
            - name: HOME
              value: "/var/lib/rabbitmq"
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"  # Augmenté de 512Mi à 1Gi
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 150
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi