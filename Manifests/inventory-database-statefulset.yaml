apiVersion: v1
kind: Service
metadata:
  name: inventory-db
  namespace: default
spec:
  selector:
    app: inventory-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  clusterIP: None

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory-db
  namespace: default
spec:
  serviceName: inventory-db
  replicas: 1
  selector:
    matchLabels:
      app: inventory-db
  template:
    metadata:
      labels:
        app: inventory-db
    spec:
      # InitContainer pour fixer les permissions du volume avec le bon UID Debian
      initContainers:
      - name: fix-permissions
        image: debian:bullseye-slim
        command:
        - bash
        - -c
        - |
          echo "Fixing permissions for UID 101..."
          chown -R 101:101 /var/lib/postgresql/data
          chmod -R 700 /var/lib/postgresql/data
          echo "Permissions fixed successfully:"
          ls -la /var/lib/postgresql/data
        volumeMounts:
        - name: inventory-db-data
          mountPath: /var/lib/postgresql/data
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
      
      # SecurityContext au niveau du Pod pour gérer les permissions des nouveaux fichiers
      securityContext:
        fsGroup: 101
      
      containers:
      - name: postgres
        image: talibedev/play-with-container-inventory-database:v1
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: inventory-db-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inventory-db-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: inventory-db-secret
              key: POSTGRES_DB
        volumeMounts:
        - name: inventory-db-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - inventory_user
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - inventory_user
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
  
  volumeClaimTemplates:
  - metadata:
      name: inventory-db-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi