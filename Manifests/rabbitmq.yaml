apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: default
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    protocol: TCP
    port: 5672
    targetPort: 5672
  - name: management
    protocol: TCP
    port: 15672
    targetPort: 15672
  type: ClusterIP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: default
spec:
  serviceName: "rabbitmq-service"
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      
      # Fix permissions with correct Debian user
      initContainers:
      - name: fix-cookie-permissions
        image: talibedev/play-with-container-rabbitmq:v1
        command: ['sh', '-c']
        args:
        - |
          echo "Fixing cookie permissions for Debian rabbitmq user..."
          # Get the actual rabbitmq user info from your image
          RABBITMQ_UID=$(id -u rabbitmq)
          RABBITMQ_GID=$(id -g rabbitmq)
          echo "RabbitMQ UID: $RABBITMQ_UID, GID: $RABBITMQ_GID"
          
          if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then
            chown $RABBITMQ_UID:$RABBITMQ_GID /var/lib/rabbitmq/.erlang.cookie
            chmod 600 /var/lib/rabbitmq/.erlang.cookie
            echo "Cookie permissions fixed for rabbitmq user"
          else
            echo "No cookie file found"
          fi
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
        securityContext:
          runAsUser: 0  # Root needed to chown
      
      containers:
      - name: rabbitmq
        image: talibedev/play-with-container-rabbitmq:v1
        
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "600m"
        
        ports:
        - containerPort: 5672
          protocol: TCP
          name: amqp
        - containerPort: 15672
          protocol: TCP
          name: management

        env:
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_PASSWORD
        
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
        
        # STARTUP PROBE - Corrigée
        startupProbe:
          exec:
            command: 
            - sh
            - -c
            - "rabbitmq-diagnostics check_running && rabbitmqctl ping"
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 30
          timeoutSeconds: 10  # Ajout important !
        
        # LIVENESS PROBE - Après startup seulement
        livenessProbe:
          exec:
            command: ["rabbitmqctl", "ping"]
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        # READINESS PROBE - Test cohérent avec liveness
        readinessProbe:
          exec:
            command: ["rabbitmqctl", "ping"]
          initialDelaySeconds: 30  # Augmenté pour cohérence
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3

  # Volume persistant pour éviter la reconfiguration
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 200Mi
      storageClassName: "local-path"