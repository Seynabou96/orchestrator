# =============================================================================
# values-eks.yaml — overrides pour un déploiement sur EKS (cloud-design).
#
# Seules les valeurs qui DIFFÈRENT de values.yaml sont listées ici ; Helm
# fusionne ce fichier par-dessus values.yaml (les clés absentes ici
# gardent leur valeur K3s par défaut).
#
# NOTE IMPORTANTE (vérifiée, pas supposée) : gp2/gp3 nécessite que le
# driver CSI EBS soit installé comme add-on EKS — il n'est PAS présent
# par défaut sur un cluster EKS récent. Sans cet add-on, le PVC restera
# Pending. C'est une tâche du fil cloud-design, pas d'orchestrator —
# notée ici uniquement pour que ce fichier soit prêt le jour venu.
# =============================================================================

database:
  storage:
    storageClassName: "gp3"
