apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    team: {{ .Values.namespace }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-db-config
  namespace: {{ .Values.namespace }}
  labels:
    app: inventory-database
    component: configuration
data:
  POSTGRES_DB: {{ .Values.database.config.postgresDb | quote }}
  INVENTORY_DB_NAME: {{ .Values.database.config.dbName | quote }}
  INVENTORY_DB_PORT: {{ .Values.database.config.dbPort | quote }}
  # Nom de service court : valide uniquement à l'intérieur du namespace
  # inventory (où vivent à la fois inventory-app et inventory-database).
  INVENTORY_DB_HOST: "inventory-database-service"
