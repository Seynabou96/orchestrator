# =============================================================================
# values.yaml — valeurs par défaut, ciblent K3s (cluster local Vagrant).
# Pour EKS, voir values-eks.yaml.
# =============================================================================

namespace: billing

database:
  image:
    repository: sniang96/billing-db
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  resources:
    requests:
      cpu: 150m
      memory: 200Mi
    limits:
      cpu: 300m
      memory: 400Mi
  storage:
    size: 200Mi
    storageClassName: "local-path"
  config:
    postgresDb: "billing_db"
    dbName: "billing_db"
    dbPort: "5432"

rabbitmq:
  image:
    repository: sniang96/rabbit-queue
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    amqpPort: 5672
    managementPort: 15672
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 600m
      memory: 512Mi
  storage:
    size: 200Mi
    storageClassName: "local-path"

app:
  image:
    repository: sniang96/billing-app
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  # billing-app est un StatefulSet à 1 réplica (exigence du sujet) :
  # gunicorn tourne avec --workers 1 (cohérence du consumer RabbitMQ
  # avec thread daemon, pas de scaling horizontal prévu ici).
  replicas: 1
  resources:
    requests:
      cpu: 150m
      memory: 200Mi
    limits:
      cpu: 300m
      memory: 400Mi
  probes:
    path: /health
    port: 8080
