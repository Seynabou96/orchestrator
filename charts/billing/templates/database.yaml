apiVersion: v1
kind: Service
metadata:
  name: billing-database-service
  namespace: {{ .Values.namespace }}
  labels:
    app: billing-database
    component: service
spec:
  selector:
    app: billing-database
  ports:
    - name: postgres
      port: {{ .Values.database.service.port }}
      targetPort: {{ .Values.database.service.port }}
      protocol: TCP
  type: ClusterIP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-database
  namespace: {{ .Values.namespace }}
  labels:
    app: billing-database
spec:
  serviceName: "billing-database-service"
  replicas: 1
  selector:
    matchLabels:
      app: billing-database
  template:
    metadata:
      labels:
        app: billing-database
    spec:
      initContainers:
        - name: fix-volume-permissions
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          command: ["sh", "-c"]
          args:
            - |
              PG_UID=$(id -u postgres)
              PG_GID=$(id -g postgres)
              echo "postgres UID=$PG_UID GID=$PG_GID"
              chown -R "$PG_UID:$PG_GID" /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
          volumeMounts:
            - name: billing-db-storage
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
      containers:
        - name: billing-database
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.database.service.port }}
          volumeMounts:
            - name: billing-db-storage
              mountPath: /var/lib/postgresql/data
          envFrom:
            - secretRef:
                name: billing-db-credentials
            - configMapRef:
                name: billing-db-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: billing-db-credentials
                  key: BILLING_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-db-credentials
                  key: BILLING_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: billing-db-config
                  key: POSTGRES_DB
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            failureThreshold: 40
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
  volumeClaimTemplates:
    - metadata:
        name: billing-db-storage
        labels:
          app: billing-database
          component: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.database.storage.size }}
        storageClassName: {{ .Values.database.storage.storageClassName | quote }}
