apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
    component: configuration
data:
  GATEWAY_APP_PORT: {{ .Values.app.service.port | quote }}
  # Noms cross-namespace : inventory-app vit dans le namespace
  # "inventory", rabbitmq dans "billing". Le suffixe .<namespace> est
  # nécessaire car api-gateway tourne dans un namespace différent —
  # voir Manifests/namespaces pour le découpage complet.
  INVENTORY_APP_HOST: {{ .Values.dependencies.inventory.host | quote }}
  INVENTORY_APP_PORT: {{ .Values.dependencies.inventory.port | quote }}
  RABBITMQ_HOST: {{ .Values.dependencies.rabbitmq.host | quote }}
  RABBITMQ_PORT: {{ .Values.dependencies.rabbitmq.port | quote }}

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
    component: service
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.port }}
      protocol: TCP
  # ClusterIP : l'exposition externe passe par l'Ingress Cilium
  # (voir ingress.yaml), pas par un Service type LoadBalancer ici.
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
spec:
  replicas: {{ .Values.app.hpa.minReplicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-inventory-app
          image: busybox
          command: ["sh", "-c"]
          args:
            - |
              echo "Attente de {{ .Values.dependencies.inventory.host }}:{{ .Values.dependencies.inventory.port }}..."
              until nc -z {{ .Values.dependencies.inventory.host }} {{ .Values.dependencies.inventory.port }}; do
                sleep 3
              done
              echo "inventory-app prêt."
        - name: wait-for-rabbitmq
          image: busybox
          command: ["sh", "-c"]
          args:
            - |
              echo "Attente de {{ .Values.dependencies.rabbitmq.host }}:{{ .Values.dependencies.rabbitmq.port }}..."
              until nc -z {{ .Values.dependencies.rabbitmq.host }} {{ .Values.dependencies.rabbitmq.port }}; do
                sleep 3
              done
              echo "RabbitMQ prêt."
      containers:
        - name: api-gateway
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.service.port }}
          envFrom:
            - configMapRef:
                name: api-gateway-config
            # Secret RabbitMQ dupliqué (et réellement re-scellé, pas
            # copié) dans ce namespace — voir Scripts/seal-secrets.sh.
            - secretRef:
                name: rabbitmq-credentials
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.app.probes.path }}
              port: {{ .Values.app.probes.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: {{ .Values.app.probes.path }}
              port: {{ .Values.app.probes.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.app.probes.path }}
              port: {{ .Values.app.probes.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway-deployment
  minReplicas: {{ .Values.app.hpa.minReplicas }}
  maxReplicas: {{ .Values.app.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
