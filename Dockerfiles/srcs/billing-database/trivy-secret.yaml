# =============================================================================
# trivy-secret.yaml — exceptions de scan de SECRETS, distinctes de
# .trivyignore qui ne couvre que les CVE.
#
# Confirmé par un mainteneur Trivy (aquasecurity/trivy#4612) : les
# secrets s'ignorent via un fichier --secret-config séparé, avec une
# section allow-rules — PAS via .trivyignore plat (qui n'accepte que des
# identifiants CVE), et PAS via la clé `secrets:` de .trivyignore.yaml
# sans le flag --secret-config en plus pour que Trivy charge ce fichier.
#
# Usage :
#   trivy image --secret-config ./srcs/billing-database/trivy-secret.yaml <image>
# =============================================================================

allow-rules:
  - id: skip-ssl-cert-snakeoil
    description: >
      /etc/ssl/private/ssl-cert-snakeoil.key est un certificat
      auto-signé FACTICE généré automatiquement par le paquet Debian
      ssl-cert à l'installation (dépendance transitive de
      postgresql-common). "snakeoil" est le nom ironique donné par
      convention Debian à ce certificat de test — il n'a jamais vocation
      à servir de vrai secret et est strictement identique sur toute
      installation Debian utilisant ce paquet. Confirmé comme faux
      positif connu (issue similaire : aquasecurity/trivy-operator#2116,
      même fichier détecté sur l'image officielle zalando/spilo-15).
      revu 2026-06-21
    path: /etc/ssl/private/ssl-cert-snakeoil.key
